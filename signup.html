<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="blob"></div>

    <div class="container">
        <div class="card">

            <h2>Create Account</h2>
            <p class="subtitle">Fill in the details to sign up.</p>

            <form id="signupForm">

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="signupUsername" required>
                    <p id="username-feedback" class="feedback-text"></p>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="email" id="signupIdentifier" required style="flex: 1;">
                        <button type="button" id="sendOtpBtn" class="btn-secondary">Send OTP</button>
                    </div>
                    <p id="email-feedback" class="feedback-text"></p>
                </div>

                <div class="input-group" id="otpSection" style="display: none;">
                    <label>Enter OTP</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="otpInput" placeholder="6-digit OTP" style="flex: 1;">
                        <button type="button" id="verifyOtpBtn" class="btn-secondary">Verify</button>
                    </div>
                    <p id="otp-feedback" class="feedback-text"></p>
                    <p id="otp-timer" class="feedback-text" style="color: #666;"></p>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" required>
                    <p id="password-feedback" class="feedback-text"></p>
                </div>

                <p id="signup-error" class="hidden" style="color:red; text-align:center;"></p>

                <button class="btn-primary" id="signupBtn" disabled>Sign Up</button>

            </form>

            <p class="footer-text">
                Already have an account? <a href="index.html">Login</a>
            </p>

        </div>
    </div>

    <script src="signup.js"></script>
</body>

</html>
